services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile
    image: ride-booking-jenkins:latest
    container_name: ride-booking-jenkins
    restart: unless-stopped
    privileged: true
    user: root

    environment:
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal

    ports:
      - "8080:8080"
      - "50000:50000"

    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  jenkins_home: